<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/error.css}" />
    <title>Account Frozen</title>
</head>
<body>
  <div class="auth-container">
    <div class="forms-container">
      <div class="auth-forms">
        <div class="auth-form">
          <div class="error-container">
            <div class="error-icon">
              <i class="fas fa-exclamation-triangle"></i>
            </div>

            <h2 class="title">Access Denied!</h2>

            <div class="alert alert-danger">
              <p th:utext="${error} ?: 'Your Account Has Been Banned. <br> Contact Support: snmmnva@gmail.com'"></p>
            </div>

            <th:block th:if="${error == 'Link already expired, resend link'}">
              <form th:action="@{/forgot-password/resend}" method="post" class="resend-form">
                <input type="hidden" name="email" th:text="${email}">
                <button type="submit" class="btn resend-btn">
                  <i class="fas fa-redo"></i> Resend Reset Link
                </button>
              </form>
            </th:block>

            <div class="back-action">
              <a th:href="@{/auth}" class="account-link">
                <i class="fas fa-arrow-left"></i> Go Back
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="panels-container">
      <div class="panel left-panel error-help">
        <div class="content">
          <h3>Need help?</h3>
          <p>Contact support for further information and resolving this issue</p>
        </div>
        <img th:src="@{/images/error.png}" class="image" alt="Help illustration">
      </div>
    </div>   
  </div>
</body>
</html>
