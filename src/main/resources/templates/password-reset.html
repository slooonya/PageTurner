<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/auth.css}" />
  <link rel="stylesheet" th:href="@{/css/global.css}" />
</head>
<body>
  <div class="auth-container single-form">
    <div class="forms-container">
      <div class="auth-forms">
        <form th:action="@{/password-reset}" method="post" class="auth-form" id="resetPasswordForm">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input type="hidden" name="token" th:value="${token}">
                    
          <h2 class="title">Create New Password</h2>

          <div th:if="${message}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${message}"></span>
          </div>
                
          <div th:if="${error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
          </div>
                
          <div class="input-field">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="New Password" required
            pattern="^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).{8,64}$"
            title="Password must contain at least 1 number, 1 uppercase and 1 lowercase letter, and be 8-64 characters long">
          </div>
                
          <div class="input-field">
            <i class="fas fa-lock"></i>
            <input type="password" id="confirmPassword" name="confirmPassword" 
                    placeholder="Confirm New Password" required>
          </div>
                
          <div class="password-requirements">
            <p>Password must contain:</p>

            <ul>
              <li id="req-length">
                <i class="fas fa-xmark requirement-icon"></i>
                <span>8-64 characters</span>
              </li>

              <li id="req-uppercase">
                <i class="fas fa-xmark requirement-icon"></i>
                <span>1 uppercase letter</span>
              </li>

              <li id="req-lowercase">
                <i class="fas fa-xmark requirement-icon"></i>
                <span>1 lowercase letter</span>
              </li>

              <li id="req-number">
                <i class="fas fa-xmark requirement-icon"></i>
                <span>1 number</span>
              </li>
            </ul>
          </div>
                
          <button type="submit" class="btn reset-btn">Update Password</button>
                
          <div class="account-text mt-3">
              <a th:href="@{/auth}" class="account-link">
                  <i class="fas fa-arrow-left"></i> Back to Login
              </a>
          </div>
        </form>
      </div>
    </div>
        
    <div class="panels-container">
      <div class="panel left-panel">
        <div class="content">
          <h3>Want to change your password?</h3>
          <p>Make sure it's different from previous ones</p>
        </div>
        <img th:src="@{/images/password-reset.png}" class="image">
      </div>
    </div>
  </div>

  <script th:src="@{/js/pages/password-reset/password-reset.js}" defer></script>
</body>
</html>
