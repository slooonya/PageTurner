<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/search-filter.css}">
    <link rel="stylesheet" th:href="@{/css/modal.css}">
    <link rel="stylesheet" th:href="@{/css/toast.css}">
    <link rel="stylesheet" th:href="@{/css/user-list.css}">
</head>
<body>
  <nav class="navbar">
    <ul class="navbar-nav">
      <li class="logo">
        <a th:href="@{/admin-home}" class="nav-link">
          <i class="fas fa-book-open fa-2x"></i>
          <span class="link-text logo-text">PageTurner</span>
        </a>
      </li>

      <li class="nav-item">
        <a th:href="@{/admin-home}" class="nav-link">
          <i class="fas fa-home fa-2x"></i>
          <span class="link-text">Logs</span>
        </a>
      </li>

      <li class="nav-item">
        <a th:href="@{/violations}" class="nav-link">
          <i class="fas fa-exclamation-triangle fa-2x"></i>
          <span class="link-text">Violations</span>
        </a>
      </li>

      <li class="nav-item">
        <a th:href="@{/user-list}" class="nav-link">
          <i class="fas fa-users fa-2x"></i>
          <span class="link-text">User List</span>
        </a>
      </li>

      <li class="nav-item">
        <a th:href="@{/admin-profile}" class="nav-link">
          <i class="fas fa-user fa-2x"></i>
          <span class="link-text">Profile</span>
        </a>
      </li>

      <li class="nav-item">
        <form id="logoutForm" th:action="@{/logout}" method="POST" class="nav-form">
          <button type="submit" class="nav-link">
            <i class="fas fa-sign-out-alt fa-2x"></i>
            <span class="link-text">Logout</span>
          </button>
        </form>
      </li>
    </ul>
  </nav>

<main>
  <div class="container">
    <header>
      <div class="header-top">
        <h1>User Management</h1>
      </div>

      <div class="toolbar">
        <form method="GET" th:action="@{/user-list}" class="search-box">
          <input type="text" name="searchQuery" class="search-input" placeholder="Search users..." th:value="${searchQuery}">
          
          <button type="submit" class="btn-icon">
            <i class="fas fa-search"></i>
          </button>
        </form>

        <form method="GET" th:action="@{/user-list}" class="sort-options">

          <select name="sortField" class="form-select">
            <option value="id">ID</option>
            <option value="username">Username</option>
            <option value="email">Email</option>
            <option value="isFrozen">Status</option>
            <option value="timesFlagged">Flagged</option>
            <option value="roles">Role</option>
          </select>

          <select name="sortDirection" class="form-select">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>

          <button class="btn">
            <i class="fas fa-sort"></i>
            Apply
          </button>
        </form>
      </div>
    </header>

    <div class="logs-container">
      <form id="userActionForm" method="POST" class="user-management-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="user-table-container">
          <table class="user-table">
            <thead>
              <tr>
                <th>Select</th>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Status</th>
                <th>Flagged</th>
                <th>Role</th>
              </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
              <td class="checkbox-cell">
                <input 
                  type="checkbox"
                  name="selectedUsers"
                  th:value="${user.id}">
              </td>
              <td th:text="${user.id}"></td>
              <td th:text="${user.username}"></td>
              <td th:text="${user.email}"></td>
              <td class="status-cell">
                <span th:if="${user.isFrozen}" class="status-badge frozen">
                  <i class="fas fa-lock"></i>
                  Frozen
                </span>

                <span th:unless="${user.isFrozen}" class="status-badge active">
                  <i class="fas fa-check-circle"></i>
                  Active
                </span>
              </td>

              <td class="status-cell">
                <span th:if="${user.timesFlagged > 0}" class="status-badge flagged">
                  <i class="fas fa-flag"></i>
                  Yes
                </span>

                <span th:unless="${user.timesFlagged > 0}" class="status-badge">
                  <i class="fas fa-times"></i>
                  No
                </span>
              </td>

              <td class="role-cell">
                <span th:each="role:${user.roles}" class="role-item">
                  <span th:if="${role.name=='ROLE_ADMIN'}" class="role-badge admin">
                    <i class="fas fa-shield-alt"></i>
                    Admin
                  </span>

                  <span th:if="${role.name=='ROLE_USER'}" class="role-badge user">
                    <i class="fas fa-user"></i>
                    User
                  </span>
                </span>
              </td>
            </tr>
            </tbody>
          </table>
        </div>

        <div class="table-actions">
          <button type="button" data-endpoint="/user-list/freeze" class="btn secondary" data-user-action="freeze">
            <i class="fas fa-lock"></i>
            Freeze
          </button>

          <button type="button" data-endpoint="/user-list/unfreeze" class="btn" data-user-action="unfreeze">
            <i class="fas fa-unlock"></i>
            Unfreeze
          </button>


          <button type="button" data-endpoint="/user-list/change-role" data-user-action="promote to admin" data-role="ROLE_ADMIN" class="btn">
            <i class="fas fa-level-up-alt"></i>
            Promote
          </button>

          <button type="button" data-endpoint="/user-list/change-role" data-user-action="demote to user"
            data-role="ROLE_USER" class="btn secondary">
            <i class="fas fa-level-down-alt"></i>
            Demote
          </button>
        </div>
      </form>
    </div>
  </div>
</main>

<div class="modal" id="confirmationModal" role="dialog" aria-modal="true"
    aria-labelledby="confirmationTitle" aria-hidden="true" hidden>
  <div class="modal-content small-modal">
    <div class="modal-header">
      <i class="fas fa-exclamation-circle fa-2x" aria-hidden="true"></i>
        <h2 id="confirmationTitle">Confirm Action</h2>
        <button type="button" class="modal-close" aria-label="Close confirmation dialog">
          &times;
        </button>
    </div>

    <div class="modal-body">
      <p id="confirmationMessage">
        Are you sure you want to perform this action?
      </p>
    </div>

    <div class="modal-actions">
      <button type="button" id="confirmActionBtn" class="btn danger">
        <i class="fas fa-check" aria-hidden="true"></i>
        Confirm
      </button>

      <button type="button" id="confirmCancelBtn" class="btn secondary">
        <i class="fas fa-times" aria-hidden="true"></i>
        Cancel
      </button>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script type="module" th:src="@{/js/pages/user-list/user-list-page.js}"></script>
</body>
</html>
