<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}"/>
    <link rel="stylesheet" th:href="@{/css/global.css}"/>
    <link rel="stylesheet" th:href="@{/css/error.css}" />
</head>
<body>
  <div class="auth-container">
    <div class="forms-container">
      <div class="auth-forms">
        <div class="auth-form">
          <div class="error-icon">
            <i class="fas fa-envelope-open-text"></i>
          </div>

          <h2 class="title">Verify Your Email</h2>
          
          <div class="alert alert-success">
            <p class="verify-text">We've sent a verification link to:</p>
            <p class="verify-email" th:text="${email}"></p>
          </div>
                    
          <div th:if="${param.resent}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> New verification email sent!
          </div>
                    
          <form th:action="@{/resend-verification}" method="post" class="resend-form">
            <input type="hidden" name="email" th:value="${email}">
            <button type="submit" class="btn resend-btn">
              <i class="fas fa-redo"></i> Resend
            </button>
          </form>
                    
          <div class="back-action">
            <a th:href="@{/auth}" class="account-link">
              <i class="fas fa-arrow-left"></i> Return to Login
            </a>
          </div>
        </div>
      </div>
    </div>
        
    <div class="panels-container">
      <div class="panel left-panel verify-panel">
        <div class="content">
          <h3>Didn't receive the email?</h3>
          <p>Check your spam folder or resend the verification link</p>
        </div>
        <img th:src="@{/images/verification.png}" class="image" alt="Email verification illustration">
      </div>
    </div>
  </div>
</body>
</html>
